service: selfpomodoro-serverless

provider:
  name: aws
  runtime: provided.al2
  region: ap-northeast-1
  stage: ${opt:stage, 'dev'}
  profile: selfpomodoro-dev
  versionFunctions: false


  # 🎯 IAM権限設定（最適化Lambda用DynamoDB・SQSアクセス）
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchWriteItem
            - dynamodb:BatchGetItem
            - dynamodb:Scan
            - dynamodb:DescribeTable
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:545009834501:table/selfpomodoro_unified_table_dev
            - arn:aws:dynamodb:${self:provider.region}:545009834501:table/selfpomodoro_unified_table_dev/index/*
        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:SendMessage
          Resource:
            - arn:aws:sqs:${self:provider.region}:545009834501:selfpomodoro-round-optimization-${self:provider.stage}
            - arn:aws:sqs:${self:provider.region}:545009834501:selfpomodoro-session-optimization-${self:provider.stage}
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: arn:aws:logs:${self:provider.region}:545009834501:*

  environment:
    COGNITO_USER_POOL_ID: ap-northeast-1_UltsO4poH
    COGNITO_CLIENT_ID: 2dbjjcvvon3trtt5imonmpnq9g
    DYNAMO_UNIFIED_TABLE: selfpomodoro_unified_table_dev
    SQS_ROUND_OPTIMIZATION_URL: https://sqs.ap-northeast-1.amazonaws.com/545009834501/selfpomodoro-round-optimization-dev
    SQS_SESSION_OPTIMIZATION_URL: https://sqs.ap-northeast-1.amazonaws.com/545009834501/selfpomodoro-session-optimization-dev
    OPTIMIZATION_SERVER_URL: http://localhost:8000
    LOG_LEVEL: info
    ENVIRONMENT: development

functions:
  api-tasks:
    handler: bootstrap
    package:
      artifact: functions/api-tasks/bootstrap.zip
    events:
      # タスク一覧取得
      - http:
          path: /api/v1/tasks
          method: get
          cors: true
      # タスク作成
      - http:
          path: /api/v1/tasks
          method: post
          cors: true
      # タスク更新
      - http:
          path: /api/v1/tasks/{task_id}/edit
          method: patch
          cors: true
      # タスク完了状態切り替え
      - http:
          path: /api/v1/tasks/{task_id}/toggle
          method: patch
          cors: true
      # タスク削除
      - http:
          path: /api/v1/tasks/{task_id}
          method: delete
          cors: true

  api-sessions:
    handler: bootstrap
    package:
      artifact: functions/api-sessions/bootstrap.zip
    events:
      # セッション開始
      - http:
          path: /api/v1/sessions
          method: post
          cors: true
      # セッション完了
      - http:
          path: /api/v1/sessions/{session_id}/complete
          method: patch
          cors: true

  api-rounds:
    handler: bootstrap
    package:
      artifact: functions/api-rounds/bootstrap.zip
    events:
      # ラウンド開始
      - http:
          path: /api/v1/sessions/{session_id}/rounds
          method: post
          cors: true
      # ラウンド完了
      - http:
          path: /api/v1/rounds/{round_id}/complete
          method: patch
          cors: true

  api-statistics:
    handler: bootstrap
    package:
      artifact: functions/api-statistics/bootstrap.zip
    events:
      # 集中度トレンド取得
      - http:
          path: /api/v1/statistics/focus-trend
          method: get
          cors: true
      # 集中度ヒートマップ取得
      - http:
          path: /api/v1/statistics/focus-heatmap
          method: get
          cors: true

  api-userconfig:
    handler: bootstrap
    package:
      artifact: functions/api-userconfig/bootstrap.zip
    events:
      # UserConfig取得
      - http:
          path: /api/v1/user-config
          method: get
          cors: true
      # UserConfig更新
      - http:
          path: /api/v1/user-config
          method: put
          cors: true

  # 🎯 PostConfirmation Trigger Lambda関数（新規追加）
  post-confirmation:
    handler: bootstrap
    package:
      artifact: functions/cognito-triggers/post-confirmation/bootstrap.zip
    timeout: 30
    memorySize: 256
    # Cognito Triggerの場合、eventsセクションは不要（resourcesで設定）

# 🎯 最適化Lambda関数（Container Image with Bayesian Optimization）
  optimization-round-v2:
    image: 545009834501.dkr.ecr.ap-northeast-1.amazonaws.com/selfpomodoro-optimization-round:v5
    timeout: 30
    memorySize: 1024
    events:
      - sqs:
          arn: arn:aws:sqs:${self:provider.region}:545009834501:selfpomodoro-round-optimization-${self:provider.stage}
          batchSize: 1
    environment:
      DYNAMODB_TABLE_NAME: selfpomodoro_unified_table_dev

  optimization-session-v2:
    image: 545009834501.dkr.ecr.ap-northeast-1.amazonaws.com/selfpomodoro-optimization-session:v5
    timeout: 30
    memorySize: 1024
    events:
      - sqs:
          arn: arn:aws:sqs:${self:provider.region}:545009834501:selfpomodoro-session-optimization-${self:provider.stage}
          batchSize: 1
    environment:
      DYNAMODB_TABLE_NAME: selfpomodoro_unified_table_dev

package:
  individually: true

# 🎯 AWS Resources定義（DynamoDB + Cognito + PostConfirmation統合）
resources:
  Resources:
    # 🎯 DynamoDB統合テーブル（GSI付き）
    SelfPomodoroUnifiedTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: selfpomodoro_unified_table_dev
        BillingMode: PAY_PER_REQUEST  # オンデマンドでコスト最適化
        
        # プライマリキー定義
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: session_id
            AttributeType: S
          - AttributeName: round_id
            AttributeType: S
        
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        
        # 🎯 GSI: session_idで効率的検索
        GlobalSecondaryIndexes:
          - IndexName: SessionIdIndex
            KeySchema:
              - AttributeName: session_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL  # 全属性を投影（user_id取得のため）
          
          # 🎯 GSI: round_idで効率的検索  
          - IndexName: RoundIdIndex
            KeySchema:
              - AttributeName: round_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL  # 全属性を投影
        
        # Point-in-time Recovery（本番環境推奨）
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: false  # dev環境ではコスト削減
        
        # SSE暗号化（セキュリティ強化）
        SSESpecification:
          SSEEnabled: true
        
        # TTL設定（一時的なROUND#/SESSION#レコードの自動削除）
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
          
    # Cognito User Pool（既存のものを参照・更新）
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: selfpomodoro-users-${self:provider.stage}
        # PostConfirmation Trigger設定
        LambdaConfig:
          PostConfirmation: !GetAtt PostDashconfirmationLambdaFunction.Arn
        # 基本設定
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: false
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
        Schema:
          - Name: email
            AttributeDataType: String
            Required: true
            Mutable: true
          - Name: name
            AttributeDataType: String
            Required: false
            Mutable: true
          - Name: given_name
            AttributeDataType: String
            Required: false
            Mutable: true
          - Name: family_name
            AttributeDataType: String
            Required: false
            Mutable: true
        AutoVerifiedAttributes:
          - email
        UsernameAttributes:
          - email
        
    # Cognito User Pool Client（既存のものを参照・更新）
    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: selfpomodoro-client-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        ExplicitAuthFlows:
          - ADMIN_NO_SRP_AUTH
          - USER_PASSWORD_AUTH
        GenerateSecret: false
        TokenValidityUnits:
          AccessToken: hours
          IdToken: hours
          RefreshToken: days
        AccessTokenValidity: 24
        IdTokenValidity: 24
        RefreshTokenValidity: 30

    # PostConfirmation Lambda実行権限
    PostConfirmationLambdaPermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:invokeFunction
        FunctionName: !GetAtt PostDashconfirmationLambdaFunction.Arn
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt CognitoUserPool.Arn


  # CloudFormation Outputs（環境変数やAPI確認用）
  Outputs:
    CognitoUserPoolId:
      Description: "Cognito User Pool ID"
      Value: !Ref CognitoUserPool
      
    CognitoUserPoolClientId:
      Description: "Cognito User Pool Client ID"
      Value: !Ref CognitoUserPoolClient
      
    PostConfirmationFunctionArn:
      Description: "PostConfirmation Lambda Function ARN"
      Value: !GetAtt PostDashconfirmationLambdaFunction.Arn
